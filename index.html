<style>
  :root{
    --bg: #f3ead9;
    --card-bg: #fffdf8;
    --strip-bg: #ede1c4;
    --accent-dark: #4a4020;
    --accent-mid: #6f5b33;
    --btn-bg: #7a5c2e;
    --btn-bg-hover: #5f4622;
    --btn2-bg: #5e7048;
    --btn2-bg-hover: #4a5938;
    --chip-bg: #fffaf0;
    --env-body: #d8c185;
    --env-flap: #c7a95f;
    --env-shadow: rgba(0,0,0,0.25);
    --seal: #8a5a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]){
      --bg: #1c1912;
      --card-bg: #241f16;
      --strip-bg: #2a2419;
      --accent-dark: #f0e6c8;
      --accent-mid: #d9c98a;
      --chip-bg: #33291a;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1912;
    --card-bg: #241f16;
    --strip-bg: #2a2419;
    --accent-dark: #f0e6c8;
    --accent-mid: #d9c98a;
    --chip-bg: #33291a;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin:0;
    min-height: 100vh;
    padding: 0;
    background: var(--bg);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--accent-dark);
    position: relative;
  }

  /* ======== TELA DO ENVELOPE ======== */
  #envelopeScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 20%, #fbf4e2 0%, var(--bg) 70%);
    z-index: 50;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #envelopeScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .env-title {
    text-align: center;
  }
  .env-title .names {
    font-family: 'Brush Script MT', cursive, Georgia, serif;
    font-size: 2.1rem;
    color: var(--accent-mid);
    display: block;
  }
  .env-title .sub {
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 4px;
  }

  .envelope {
    position: relative;
    width: min(78vw, 300px);
    height: min(78vw, 300px);
    cursor: pointer;
    filter: drop-shadow(0 12px 24px var(--env-shadow));
  }
  .env-body {
    position: absolute;
    inset: 0;
    background: var(--env-body);
    border-radius: 10px;
    overflow: hidden;
  }
  .env-body::before {
    /* linhas internas do envelope (efeito bolso em V) */
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    background: linear-gradient(160deg, transparent 49.5%, rgba(0,0,0,0.08) 50%),
                linear-gradient(200deg, transparent 49.5%, rgba(0,0,0,0.08) 50%);
  }
  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background: var(--env-flap);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 0.9s cubic-bezier(.6,-0.1,.3,1.3);
    z-index: 3;
  }
  .envelope.open .env-flap {
    transform: rotateX(180deg);
  }
  .env-seal {
    position: absolute;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a9743d, var(--seal) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #f8e9c8;
    z-index: 4;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .envelope.open .env-seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }
  .env-tap-label {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fffaf0;
    background: rgba(74,64,32,0.55);
    padding: 6px 14px;
    border-radius: 999px;
    z-index: 4;
    white-space: nowrap;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.05); opacity: 0.85; }
  }
  .envelope.open .env-tap-label { display: none; }

  /* Pétalas de girassol caindo — visíveis em toda a página */
  #petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -40px;
    width: 16px;
    height: 24px;
    background: linear-gradient(160deg, #ffd873 0%, #f6b93b 55%, #e8981f 100%);
    border-radius: 60% 60% 60% 5%;
    opacity: 0.85;
    box-shadow: 0 1px 2px rgba(90,60,10,0.25) inset;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(112vh) rotate(340deg); }
  }
</style>
</head>

    </div>
    <div class="envelope" id="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal">🌻</div>
      <div class="env-tap-label">Abrindo seu convite...</div>
    </div>
  </div>

<style>
  /* ======== CONTEÚDO DO CONVITE (aparece após abrir o envelope) ======== */
  #inviteContent {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 10px 30px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease 0.15s, transform 0.7s ease 0.15s;
  }
  #inviteContent.show {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    max-width: 460px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    position: relative;
    z-index: 1;
  }
  .card img {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
  }

  .countdown-strip {
    background: var(--strip-bg);
    padding: 7px 14px 6px;
    text-align: center;
  }
  .countdown-strip .label {
    font-size: 0.62rem;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .countdown {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .countdown .unit {
    background: var(--chip-bg);
    border-radius: 9px;
    padding: 4px 4px;
    min-width: 42px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .countdown .unit .num {
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--accent-mid);
    line-height: 1;
    display:block;
  }
  .countdown .unit .txt {
    font-size: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.7;
    display:block;
    margin-top: 1px;
  }
  .countdown-done {
    font-size: 1rem;
    font-weight: bold;
    color: var(--accent-mid);
    padding: 4px 0;
  }

  .actions-strip {
    background: var(--strip-bg);
    padding: 3px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  a.btn, button.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #fffaf0;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 0.78rem;
    font-weight: bold;
    padding: 7px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: background 0.2s ease, transform 0.15s ease;
    width: 100%;
    max-width: 300px;
    justify-content: center;
    border: none;
    cursor: pointer;
  }
  a.btn.map { background: var(--btn-bg); }
  a.btn.map:hover { background: var(--btn-bg-hover); transform: translateY(-2px); }
  a.btn.cal { background: var(--btn2-bg); }
  a.btn.cal:hover { background: var(--btn2-bg-hover); transform: translateY(-2px); }
  button.btn.rsvp { background: #b5482f; }
  button.btn.rsvp:hover { background: #97381f; transform: translateY(-2px); }
  a.btn svg, button.btn svg { flex-shrink: 0; }

  .rsvp-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(30, 24, 10, 0.55);
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .rsvp-backdrop.open {
    display: flex;
    opacity: 1;
  }
  .rsvp-box {
    width: 100%;
    max-width: 320px;
    background: var(--chip-bg);
    border-radius: 16px;
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    position: relative;
    transform: scale(0.88) translateY(10px);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(.34,1.4,.64,1), opacity 0.25s ease;
  }
  .rsvp-backdrop.open .rsvp-box {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .rsvp-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--accent-mid);
    cursor: pointer;
    padding: 4px;
  }
  .rsvp-box h3 {
    margin: 0 6px 0 0;
    font-size: 1.05rem;
    color: var(--accent-dark);
    text-align: center;
  }
  .rsvp-box input {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #c9b98a;
    font-family: Georgia, serif;
    font-size: 0.95rem;
    background: #fff;
    color: #4a4020;
  }
  .rsvp-box .rsvp-choices {
    display: flex;
    gap: 8px;
  }
  .rsvp-choices button {
    flex: 1;
    padding: 9px 6px;
    border-radius: 8px;
    border: 1.5px solid #7a5c2e;
    background: transparent;
    color: var(--accent-mid);
    font-family: Georgia, serif;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .rsvp-choices button.selected {
    background: #7a5c2e;
    color: #fffaf0;
  }
  .rsvp-send {
    background: #b5482f;
    color: #fffaf0;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-family: Georgia, serif;
  }
  .rsvp-send:hover { background: #97381f; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    background: #4a4020;
    color: #fffaf0;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    max-width: 88vw;
    text-align: center;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>

            <button type="button" class="choice" data-val="Sim, vou">✅ Sim</button>
            <button type="button" class="choice" data-val="Não vou">❌ Não</button>
          </div>
          <button type="button" class="rsvp-send" id="rsvpSend">Enviar confirmação</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ---- Abertura do envelope ----
  const envelope = document.getElementById('envelope');
  const envelopeScreen = document.getElementById('envelopeScreen');
  const inviteContent = document.getElementById('inviteContent');

  function openEnvelope() {
    if (envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(() => {
      envelopeScreen.classList.add('hide');
      inviteContent.classList.add('show');
    }, 700);
  }

  // Abre sozinho após uma pequena pausa de suspense
  const autoOpenTimer = setTimeout(openEnvelope, 1400);

  // Se a pessoa tocar antes, pula a espera e abre na hora
  envelope.addEventListener('click', () => {
    clearTimeout(autoOpenTimer);
    openEnvelope();
  });

  // ---- Pétalas de girassol caindo ----
  const petalContainer = document.getElementById('petals');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*9) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    const scale = 0.7 + Math.random()*0.9;
    p.style.width = (16*scale) + 'px';
    p.style.height = (24*scale) + 'px';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    petalContainer.appendChild(p);
  }

  // ---- Contagem regressiva ----
  const eventDate = new Date('2026-10-31T12:00:00-04:00').getTime();
  const countdownEl = document.getElementById('countdown');
  function renderCountdown() {
    const now = Date.now();
    const diff = eventDate - now;
    if (diff <= 0) {
      countdownEl.innerHTML = '<div class="countdown-done">🎉 O grande dia chegou!</div>';
      return;
    }
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    countdownEl.innerHTML = `
      <div class="unit"><span class="num">${d}</span><span class="txt">dias</span></div>
      <div class="unit"><span class="num">${h}</span><span class="txt">horas</span></div>
      <div class="unit"><span class="num">${m}</span><span class="txt">min</span></div>
      <div class="unit"><span class="num">${s}</span><span class="txt">seg</span></div>
    `;
  }
  renderCountdown();
  setInterval(renderCountdown, 1000);

  // ---- Adicionar ao Google Calendar ----
  const calBtn = document.getElementById('calBtn');
  const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Aniversário de 60 anos - Sueli')
    + '&dates=20261031T160000Z/20261031T200000Z'
    + '&details=' + encodeURIComponent('Venha celebrar os 60 anos da Sueli! Traga roupa de banho e rede.')
    + '&location=' + encodeURIComponent('https://maps.google.com/maps?q=-16.47955894470215,-54.557064056396484');
  calBtn.href = gcalUrl;

  // ---- RSVP (modal flutuante) ----
  const rsvpToggle = document.getElementById('rsvpToggle');
  const rsvpBackdrop = document.getElementById('rsvpBackdrop');
  const rsvpClose = document.getElementById('rsvpClose');

  function openRsvp() { rsvpBackdrop.classList.add('open'); }
  function closeRsvp() { rsvpBackdrop.classList.remove('open'); }

  rsvpToggle.addEventListener('click', openRsvp);
  rsvpClose.addEventListener('click', closeRsvp);
  rsvpBackdrop.addEventListener('click', (e) => {
    if (e.target === rsvpBackdrop) closeRsvp();
  });

  let selectedChoice = null;
  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.choice').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedChoice = btn.dataset.val;
    });
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3200);
  }

  document.getElementById('rsvpSend').addEventListener('click', () => {
    const name = document.getElementById('rsvpName').value.trim();
    if (!name) { alert('Por favor, digite seu nome.'); return; }
    if (!selectedChoice) { alert('Selecione se você vai ou não.'); return; }
    const PHONE = '5566996548444';
    const msg = `Olá! Aqui é ${name}. Confirmando presença no aniversário de 60 anos da Sueli: ${selectedChoice}`;
    const waUrl = `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
    window.open(waUrl, '_blank');
    closeRsvp();
    showToast('✅ Sua confirmação foi enviada pelo WhatsApp!');
  });
</script>
</body>
</html>
